<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ketik Arab Nonosoft Khot (Visual Keyboard)</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Latar belakang abu-abu gelap, terinspirasi warna frame keyboard */
            background-color: #2d3436;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ecf0f1;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h2 {
            color: #2c3e50;
            margin: 0 0 15px 0;
            text-align: center;
            font-size: 22px;
        }
        textarea {
            width: 100%;
            height: 100px;
            font-family: 'Amiri', serif;
            font-size: 28px;
            direction: rtl;
            text-align: right;
            padding: 10px;
            border: 3px solid #7f8c8d;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        /* --- Area Tombol Virtual --- */
        .keyboard-layout {
            /* Warna latar area tombol seperti plate keyboard */
            background-color: #95a5a6; 
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px; /* Jarak antar baris */
        }
        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 4px; /* Jarak antar tombol */
            width: 100%;
        }
        .vk-btn {
            /* Styling tombol seperti keycaps putih di gambar */
            background-color: #ecf0f1;
            border: 1px solid #bdc3c7;
            border-bottom-width: 3px; /* Efek tombol timbul */
            color: #2c3e50;
            font-family: 'Amiri', serif;
            font-size: 24px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
            /* Ukuran dasar tombol, bisa disesuaikan */
            flex: 1; 
            min-width: 40px;
            max-width: 60px;
            height: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0;
            transition: all 0.05s ease;
            -webkit-tap-highlight-color: transparent; /* Hilangkan highlight biru di HP */
        }
        .vk-btn:active {
            background-color: #bdc3c7;
            border-bottom-width: 1px;
            transform: translateY(2px);
            box-shadow: none;
        }
        /* Huruf Latin kecil di pojok tombol, seperti stiker merah di gambar */
        .latin-char {
            font-family: sans-serif;
            font-size: 10px;
            color: #c0392b;
            position: absolute;
            top: 4px;
            left: 4px;
            pointer-events: none;
        }
        /* Tombol khusus dengan ukuran berbeda */
        .btn-tab { flex: 1.5; max-width: 80px; font-size: 14px; font-family: sans-serif;}
        .btn-caps { flex: 1.8; max-width: 95px; font-size: 14px; font-family: sans-serif;}
        .btn-enter { flex: 2.0; max-width: 105px; font-size: 14px; font-family: sans-serif;}
        .btn-shift { flex: 2.4; max-width: 125px; font-size: 14px; font-family: sans-serif;}
        .btn-space { flex: 6; max-width: 350px; height: 45px;}
        .btn-ctrl, .btn-alt, .btn-win { flex: 1.2; max-width: 65px; font-size: 14px; font-family: sans-serif;}
        
        /* Tombol fungsi (F1-F12) di bagian atas */
        .function-row {
            justify-content: space-between;
            margin-bottom: 15px;
            background-color: #2c3e50;
            padding: 5px;
            border-radius: 6px;
        }
        .vk-btn-func {
            background-color: #bdc3c7;
            height: 35px;
            font-size: 12px;
            font-family: sans-serif;
            flex: none;
            width: calc(100% / 12 - 4px); /* Hitung lebar otomatis 12 tombol */
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .btn-action {
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-action:hover { background-color: #922b21; }

        /* Media Query untuk HP: tombol sedikit lebih kecil agar muat */
        @media (max-width: 600px) {
            .vk-btn { font-size: 20px; height: 45px; min-width: 35px;}
            .latin-char { font-size: 8px; top: 2px; left: 2px; }
            .vk-btn-func { font-size: 10px; height: 30px; }
            textarea { height: 80px; font-size: 22px;}
            .container { padding: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Simulasi Keyboard Nonosoft Khot</h2>

    <textarea id="arabicInput" placeholder="Ketik di sini..."></textarea>

    <div class="toolbar">
        <button class="btn-action" onclick="clearText()">Hapus</button>
        <button class="btn-action" onclick="backspace()">← Backspace</button>
        <button class="btn-action" style="background-color: #27ae60;" onclick="insertText(' ')">Spasi</button>
    </div>

    <hr style="margin: 10px 0; border: 0; border-top: 1px solid #ddd;">

    <!-- Area Keyboard Virtual -->
    <div class="keyboard-layout">
        <!-- Baris F1-F12 -->
        <div class="keyboard-row function-row">
            <button class="vk-btn vk-btn-func" onclick="insertHarakat('\u064E')">F1<br>Fathah</button>
            <button class="vk-btn vk-btn-func" onclick="insertHarakat('\u0650')">F2<br>Kasrah</button>
            <button class="vk-btn vk-btn-func" onclick="insertHarakat('\u064F')">F3<br>Dammah</button>
            <button class="vk-btn vk-btn-func" onclick="insertHarakat('\u064B')">F4<br>Fathatain</button>
            <button class="vk-btn vk-btn-func" onclick="insertHarakat('\u064C')">F5<br>Kasratain</button>
            <button class="vk-btn vk-btn-func" onclick="insertHarakat('\u064D')">F6<br>Dammatain</button>
            <button class="vk-btn vk-btn-func" onclick="insertHarakat('\u0651')">F7<br>Syaddah</button>
            <button class="vk-btn vk-btn-func" onclick="insertHarakat('')">F8</button>
            <button class="vk-btn vk-btn-func" onclick="insertHarakat('')">F9</button>
            <button class="vk-btn vk-btn-func" onclick="insertHarakat('')">F10</button>
            <button class="vk-btn vk-btn-func" onclick="insertHarakat('\u0652')">F11<br>Sukun</button>
            <button class="vk-btn vk-btn-func" onclick="insertHarakat('')">F12</button>
        </div>

        <!-- Baris Angka 1-0 -->
        <div class="keyboard-row">
            <button class="vk-btn">ى<span class="latin-char">`</span></button>
            <button class="vk-btn">١<span class="latin-char">1</span></button>
            <button class="vk-btn">٢<span class="latin-char">2</span></button>
            <button class="vk-btn">٣<span class="latin-char">3</span></button>
            <button class="vk-btn">٤<span class="latin-char">4</span></button>
            <button class="vk-btn">٥<span class="latin-char">5</span></button>
            <button class="vk-btn">٦<span class="latin-char">6</span></button>
            <button class="vk-btn">٧<span class="latin-char">7</span></button>
            <button class="vk-btn">٨<span class="latin-char">8</span></button>
            <button class="vk-btn">٩<span class="latin-char">9</span></button>
            <button class="vk-btn">٠<span class="latin-char">0</span></button>
            <button class="vk-btn">-<span class="latin-char">-</span></button>
            <button class="vk-btn">١<span class="latin-char">=</span></button>
            <button class="vk-btn" style="flex: 1.2;">←</button>
        </div>

        <!-- Baris QWERTY -->
        <div class="keyboard-row">
            <button class="vk-btn btn-tab">Tab ↰</button>
            <button class="vk-btn">ق<span class="latin-char">Q</span></button>
            <button class="vk-btn">و<span class="latin-char">W</span></button>
            <button class="vk-btn">ع<span class="latin-char">E</span></button>
            <button class="vk-btn">ر<span class="latin-char">R</span></button>
            <button class="vk-btn">ت<span class="latin-char">T</span></button>
            <button class="vk-btn">ي<span class="latin-char">Y</span></button>
            <button class="vk-btn">ث<span class="latin-char">U</span></button>
            <button class="vk-btn">ء<span class="latin-char">I</span></button>
            <button class="vk-btn">خ<span class="latin-char">O</span></button>
            <button class="vk-btn">ح<span class="latin-char">P</span></button>
            <button class="vk-btn">ج<span class="latin-char">[</span></button>
            <button class="vk-btn">د<span class="latin-char">]</span></button>
            <button class="vk-btn" style="flex: 1.3;">\</button>
        </div>

        <!-- Baris ASDFGH -->
        <div class="keyboard-row">
            <button class="vk-btn btn-caps">Caps Lock</button>
            <button class="vk-btn">ش<span class="latin-char">A</span></button>
            <button class="vk-btn">س<span class="latin-char">S</span></button>
            <button class="vk-btn">ي<span class="latin-char">D</span></button>
            <button class="vk-btn">ب<span class="latin-char">F</span></button>
            <button class="vk-btn">ل<span class="latin-char">G</span></button>
            <button class="vk-btn">ا<span class="latin-char">H</span></button>
            <button class="vk-btn">ت<span class="latin-char">J</span></button>
            <button class="vk-btn">ن<span class="latin-char">K</span></button>
            <button class="vk-btn">م<span class="latin-char">L</span></button>
            <button class="vk-btn">ك<span class="latin-char">;</span></button>
            <button class="vk-btn">ة<span class="latin-char">'</span></button>
            <button class="vk-btn btn-enter" onclick="insertText('\n')">Enter ↵</button>
        </div>

        <!-- Baris ZXCVBN -->
        <div class="keyboard-row">
            <button class="vk-btn btn-shift">Shift ↑</button>
            <button class="vk-btn">ظ<span class="latin-char">Z</span></button>
            <button class="vk-btn">ط<span class="latin-char">X</span></button>
            <button class="vk-btn">ذ<span class="latin-char">C</span></button>
            <button class="vk-btn">ء<span class="latin-char">V</span></button>
            <button class="vk-btn">ؤ<span class="latin-char">B</span></button>
            <button class="vk-btn">إ<span class="latin-char">N</span></button>
            <button class="vk-btn">أ<span class="latin-char">M</span></button>
            <button class="vk-btn">ئ<span class="latin-char">,</span></button>
            <button class="vk-btn">ء<span class="latin-char">.</span></button>
            <button class="vk-btn">ء<span class="latin-char">/</span></button>
            <button class="vk-btn btn-shift" style="flex: 1.5;">Shift</button>
        </div>

        <!-- Baris Bawah -->
        <div class="keyboard-row">
            <button class="vk-btn btn-ctrl">Ctrl</button>
            <button class="vk-btn btn-win">Win</button>
            <button class="vk-btn btn-alt">Alt</button>
            <button class="vk-btn btn-space" onclick="insertText(' ')">Space</button>
            <button class="vk-btn btn-alt">Alt</button>
            <button class="vk-btn btn-ctrl">Ctrl</button>
        </div>
    </div>
