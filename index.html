<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ketik Arab Nonosoft Khot - Sesuai Panduan</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2d3436;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ecf0f1;
            touch-action: manipulation;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h2 {
            color: #2c3e50;
            margin: 0 0 15px 0;
            text-align: center;
            font-size: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            font-family: 'Amiri', serif;
            font-size: 28px;
            direction: rtl;
            text-align: right;
            padding: 10px;
            border: 3px solid #7f8c8d;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 10px;
            color: #000;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .btn-action {
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-action:active { background-color: #922b21; }

        /* --- Area Keyboard Virtual --- */
        .keyboard-layout {
            background-color: #95a5a6; 
            padding: 8px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }
        .vk-btn {
            background-color: #ecf0f1;
            border: 1px solid #bdc3c7;
            border-bottom-width: 3px;
            color: #2c3e50;
            font-family: 'Amiri', serif;
            font-size: 22px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
            flex: 1; 
            min-width: 32px;
            max-width: 60px;
            height: 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }
        .vk-btn:active, .vk-btn.touched {
            background-color: #bdc3c7;
            border-bottom-width: 1px;
            transform: translateY(2px);
            box-shadow: none;
        }
        .vk-btn.shift-active {
            background-color: #e67e22 !important;
            color: white !important;
            border-color: #d35400 !important;
        }
        .latin-char {
            font-family: sans-serif;
            font-size: 9px;
            color: #c0392b;
            position: absolute;
            top: 2px;
            left: 3px;
        }
        
        /* Ukuran tombol khusus */
        .btn-wide { flex: 1.5; max-width: 75px; font-size: 12px; font-family: sans-serif; }
        .btn-wider { flex: 1.8; max-width: 85px; font-size: 12px; font-family: sans-serif; }
        .btn-widest { flex: 2.2; max-width: 100px; font-size: 12px; font-family: sans-serif; }
        .btn-space { flex: 6; max-width: 320px; height: 45px; font-family: sans-serif; font-size: 14px; }
        
        /* Baris Tombol Fungsi F1-F12 */
        .function-row {
            justify-content: space-between;
            margin-bottom: 10px;
            background-color: #2c3e50;
            padding: 4px;
            border-radius: 6px;
        }
        .vk-btn-func {
            background-color: #f1c40f;
            color: #2c3e50;
            height: 40px;
            font-size: 9px;
            font-family: sans-serif;
            flex: 1;
            max-width: none;
            font-weight: bold;
            border-bottom-width: 3px;
            border-color: #d4ac0d;
            line-height: 1.2;
        }

        @media (max-width: 600px) {
            .vk-btn { font-size: 18px; height: 42px; min-width: 26px; }
            .latin-char { font-size: 8px; }
            .vk-btn-func { font-size: 8px; height: 36px; }
            textarea { height: 80px; font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ketik Arab Nonosoft Khot (Sesuai Panduan)</h2>

    <div class="toolbar">
        <button class="btn-action" onclick="clearText()">Hapus Semua</button>
        <button class="btn-action" style="background-color: #d35400;" onclick="backspace()">← Hapus 1 Karakter</button>
    </div>

    <textarea id="arabicInput" placeholder="Sentuh huruf, lalu pilih harakat di atas..."></textarea>

    <div class="keyboard-layout">
        
        <!-- Baris F1 - F12 Sesuai Tabel Panduan Nonosoft Khot -->
        <div class="keyboard-row function-row">
            <button class="vk-btn vk-btn-func" data-normal="َ" data-shift="َّ">F1<br>َ / ّ+َ</button>
            <button class="vk-btn vk-btn-func" data-normal="ِ" data-shift="ِّ">F2<br>ِ / ّ+ِ</button>
            <button class="vk-btn vk-btn-func" data-normal="ُ" data-shift="ُّ">F3<br>ُ / ّ+ُ</button>
            <button class="vk-btn vk-btn-func" data-normal="ً" data-shift="ًّ">F4<br>ً / ّ+ً</button>
            <button class="vk-btn vk-btn-func" data-normal="ٍ" data-shift="ٍّ">F5<br>ٍ / ّ+ٍ</button>
            <button class="vk-btn vk-btn-func" data-normal="ٌ" data-shift="ٌّ">F6<br>ٌ / ّ+ٌ</button>
            <button class="vk-btn vk-btn-func" data-normal="aa" data-shift="ّaa">F7<br>aa / ّ+aa</button>
            <button class="vk-btn vk-btn-func" data-normal="ii" data-shift="ّii">F8<br>ii / ّ+ii</button>
            <button class="vk-btn vk-btn-func" data-normal="uu" data-shift="ّuu">F9<br>uu / ّ+uu</button>
            <button class="vk-btn vk-btn-func" data-normal="" data-shift="ٰ">F10<br>Mad<br>Jaiz</button>
            <button class="vk-btn vk-btn-func" data-normal="ْ" data-shift="">F11<br>Sukun</button>
            <button class="vk-btn vk-btn-func" data-normal="" data-shift="">F12</button>
        </div>

        <!-- Baris Angka & Simbol Atas -->
        <div class="keyboard-row">
            <button class="vk-btn" data-normal="ى" data-shift="~">ى<span class="latin-char">`</span></button>
            <button class="vk-btn" data-normal="١" data-shift="!">١<span class="latin-char">1</span></button>
            <button class="vk-btn" data-normal="٢" data-shift="@">٢<span class="latin-char">2</span></button>
            <button class="vk-btn" data-normal="٣" data-shift="#">٣<span class="latin-char">3</span></button>
            <button class="vk-btn" data-normal="٤" data-shift="$">٤<span class="latin-char">4</span></button>
            <button class="vk-btn" data-normal="٥" data-shift="%">٥<span class="latin-char">5</span></button>
            <button class="vk-btn" data-normal="٦" data-shift="^">٦<span class="latin-char">6</span></button>
            <button class="vk-btn" data-normal="٧" data-shift="&">٧<span class="latin-char">7</span></button>
            <button class="vk-btn" data-normal="٨" data-shift="*">٨<span class="latin-char">8</span></button>
            <button class="vk-btn" data-normal="٩" data-shift="(">٩<span class="latin-char">9</span></button>
            <button class="vk-btn" data-normal="٠" data-shift=")">٠<span class="latin-char">0</span></button>
            <button class="vk-btn" data-normal="-" data-shift="_">-<span class="latin-char">-</span></button>
            <button class="vk-btn" data-normal="=" data-shift="+">=<span class="latin-char">=</span></button>
            <button class="vk-btn btn-wide" onclick="backspace()">Back</button>
        </div>

        <!-- Baris ke-2: Q W E R T Y U I O P [ ] \ -->
        <div class="keyboard-row">
            <button class="vk-btn btn-wide" data-normal="">Tab</button>
            <button class="vk-btn" data-normal="ق" data-shift="Q">ق<span class="latin-char">Q</span></button>
            <button class="vk-btn" data-normal="و" data-shift="W">و<span class="latin-char">W</span></button>
            <button class="vk-btn" data-normal="ع" data-shift="E">ع<span class="latin-char">E</span></button>
            <button class="vk-btn" data-normal="ر" data-shift="R">ر<span class="latin-char">R</span></button>
            <button class="vk-btn" data-normal="ت" data-shift="T">ت<span class="latin-char">T</span></button>
            <button class="vk-btn" data-normal="ي" data-shift="Y">ي<span class="latin-char">Y</span></button>
            <button class="vk-btn" data-normal="ث" data-shift="U">ث<span class="latin-char">U</span></button>
            <button class="vk-btn" data-normal="ء" data-shift="I">ء<span class="latin-char">I</span></button>
            <button class="vk-btn" data-normal="خ" data-shift="O">خ<span class="latin-char">O</span></button>
            <button class="vk-btn" data-normal="ح" data-shift="P">ح<span class="latin-char">P</span></button>
            <button class="vk-btn" data-normal="ض" data-shift="{">ض<span class="latin-char">[</span></button>
            <button class="vk-btn" data-normal="ص" data-shift="}">ص<span class="latin-char">]</span></button>
            <button class="vk-btn btn-wide" data-normal="\" data-shift="|">\</button>
        </div>

        <!-- Baris ke-3: A S D F G H J K L ; ' Enter -->
        <div class="keyboard-row">
            <button class="vk-btn btn-wider" data-normal="">Caps</button>
            <button class="vk-btn" data-normal="ا" data-shift="A">ا<span class="latin-char">A</span></button>
            <button class="vk-btn" data-normal="س" data-shift="S">س<span class="latin-char">S</span></button>
            <button class="vk-btn" data-normal="د" data-shift="D">د<span class="latin-char">D</span></button>
            <button class="vk-btn" data-normal="ف" data-shift="F">ف<span class="latin-char">F</span></button>
            <button class="vk-btn" data-normal="غ" data-shift="G">غ<span class="latin-char">G</span></button>
            <button class="vk-btn" data-normal="ه" data-shift="H">ه<span class="latin-char">H</span></button>
            <button class="vk-btn" data-normal="ج" data-shift="J">ج<span class="latin-char">J</span></button>
            <button class="vk-btn" data-normal="ك" data-shift="K">ك<span class="latin-char">K</span></button>
            <button class="vk-btn" data-normal="ل" data-shift="L">ل<span class="latin-char">L</span></button>
            <button class="vk-btn" data-normal="ظ" data-shift=":">ظ<span class="latin-char">;</span></button>
            <button class="vk-btn" data-normal="ط" data-shift='"'>ط<span class="latin-char">'</span></button>
            <button class="vk-btn btn-widest" data-normal="\n">Enter ↵</button>
        </div>

        <!-- Baris ke-4: Shift Z X C V B N M , . / Shift -->
        <div class="keyboard-row">
            <button class="vk-btn btn-widest shift-key" id="shiftLeft">Shift</button>
            <button class="vk-btn" data-normal="ز" data-shift="Z">ز<span class="latin-char">Z</span></button>
            <button class="vk-btn" data-normal="ل" data-shift="X">ل<span class="latin-char">X</span></button>
            <button class="vk-btn" data-normal="ذ" data-shift="C">ذ<span class="latin-char">C</span></button>
            <button class="vk-btn" data-normal="ب" data-shift="V">ب<span class="latin-char">V</span></button>
            <button class="vk-btn" data-normal="ش" data-shift="B">ش<span class="latin-char">B</span></button>
            <button class="vk-btn" data-normal="ن" data-shift="N">ن<span class="latin-char">N</span></button>
            <button class="vk-btn" data-normal="م" data-shift="M">م<span class="latin-char">M</span></button>
            <button class="vk-btn" data-normal="ة" data-shift="<">ة<span class="latin-char">,</span></button>
            <button class="vk-btn" data-normal="ؤ" data-shift=">">ؤ<span class="latin-char">.</span></button>
            <button class="vk-btn" data-normal="ؤ" data-shift="?">ؤ<span class="latin-char">/</span></button>
            <button class="vk-btn btn-widest shift-key" id="shiftRight">Shift</button>
        </div>

        <!-- Baris Bawah (Spasi, dll) -->
        <div class="keyboard-row">
            <button class="vk-btn btn-wide" data-normal="">Ctrl</button>
            <button class="vk-btn btn-wide" data-normal="">Win</button>
            <button class="vk-btn btn-wide" data-normal="">Alt</button>
            <button class="vk-btn btn-space" data-normal=" ">Spasi (Space)</button>
            <button class="vk-btn btn-wide" data-normal="">Alt</button>
            <button class="vk-btn btn-wide" data-normal="">Ctrl</button>
        </div>

    </div>
</div>

<script>
    // ==========================================
    // KONFIGURASI ADMIN (GOOGLE SHEETS WEB APP)
    // ==========================================
    const SCRIPT_URL = https://script.google.com/macros/s/AKfycby-f_EDZ_cFLoSGX1JIl8LkZ_gL1M9QV1UUibpJcsK3Qc9XgATQP4bae8MgNZgMWJMn7g/exec; 
    // Contoh: "https://script.google.com/macros/s/AKfycby.../exec"

    // Fungsi untuk mengirim log secara otomatis ke Google Sheets admin
    function trackUser(activityName) {
        if (SCRIPT_URL.includes("MASUKKAN_URL")) return; // Abaikan jika belum disetting
        
        let payload = {
            activity: activityName,
            userAgent: navigator.userAgent
        };

        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).catch(err => console.log("Log error"));
    }

    // Catat saat halaman pertama kali dibuka oleh pengguna
    window.addEventListener("DOMContentLoaded", () => {
        trackUser("Membuka Website Ketik Arab");
    });

    // ------------------------------------------
    // KODE UTAMA KEYBOARD
    // ------------------------------------------
    const inputArea = document.getElementById('arabicInput');
    const buttons = document.querySelectorAll('.vk-btn:not(.shift-key)');
    const shiftButtons = document.querySelectorAll('.shift-key');
    
    let isShiftActive = false;

    shiftButtons.forEach(shiftBtn => {
        shiftBtn.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            isShiftActive = !isShiftActive;
            shiftButtons.forEach(sb => {
                if (isShiftActive) sb.classList.add('shift-active');
                else sb.classList.remove('shift-active');
            });
        });
    });

    buttons.forEach(button => {
        let normalChar = button.getAttribute('data-normal');
        let shiftChar = button.getAttribute('data-shift');

        if (normalChar !== null && normalChar !== '') {
            button.addEventListener('pointerdown', function(e) {
                e.preventDefault();
                
                let targetChar = (isShiftActive && shiftChar !== null && shiftChar !== '') ? shiftChar : normalChar;
                
                if (targetChar === 'aa') targetChar = 'َا';
                else if (targetChar === 'ii') targetChar = 'ِي';
                else if (targetChar === 'uu') targetChar = 'ُو';
                else if (targetChar === 'ّaa') targetChar = 'َّا';
                else if (targetChar === 'ّii') targetChar = 'ِّي';
                else if (targetChar === 'ّuu') targetChar = 'ُّو';
                else if (targetChar.startsWith('ّ') && targetChar.length > 1) {
                    targetChar = '\u0651' + targetChar.substring(1);
                }

                insertText(targetChar);
                triggerEffect(button);

                if (isShiftActive) {
                    isShiftActive = false;
                    shiftButtons.forEach(sb => sb.classList.remove('shift-active'));
                }
            });
        }
    });

    function triggerEffect(btn) {
        btn.classList.add('touched');
        setTimeout(() => {
            btn.classList.remove('touched');
        }, 150);
    }

    function insertText(text) {
        let start = inputArea.selectionStart;
        let end = inputArea.selectionEnd;
        let val = inputArea.value;

        if (text === '\\n') text = '\n';

        inputArea.value = val.substring(0, start) + text + val.substring(end);
        inputArea.selectionStart = inputArea.selectionEnd = start + text.length;
        inputArea.focus();
    }

    function backspace() {
        let start = inputArea.selectionStart;
        let end = inputArea.selectionEnd;
        let val = inputArea.value;

        if (start !== end) {
            inputArea.value = val.substring(0, start) + val.substring(end);
            inputArea.selectionStart = inputArea.selectionEnd = start;
        } else if (start > 0) {
            inputArea.value = val.substring(0, start - 1) + val.substring(end);
            inputArea.selectionStart = inputArea.selectionEnd = start - 1;
        }
        inputArea.focus();
    }

    function clearText() {
        inputArea.value = '';
        inputArea.focus();
    }
</script>

</body>
</html>
