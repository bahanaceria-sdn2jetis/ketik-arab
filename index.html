<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ketik Arab Nonosoft Khot</title>
    
    <!-- PWA Setup -->
    <meta name="theme-color" content="#2d3436">
    <link rel="manifest" href="manifest.json">

    <!-- Font khusus rendering harakat & tasydid presisi -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2d3436;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ecf0f1;
            touch-action: manipulation;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h2 {
            color: #2c3e50;
            margin: 0 0 15px 0;
            text-align: center;
            font-size: 20px;
        }
        textarea {
            width: 100%;
            height: 130px;
            font-family: 'Scheherazade New', 'Amiri', serif;
            font-size: 36px;
            line-height: 2.2;
            direction: rtl;
            text-align: right;
            padding: 10px;
            border: 3px solid #7f8c8d;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 10px;
            color: #000;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .btn-action {
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-action:active { background-color: #922b21; }

        .keyboard-layout {
            background-color: #95a5a6; 
            padding: 8px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }
        .vk-btn {
            background-color: #ecf0f1;
            border: 1px solid #bdc3c7;
            border-bottom-width: 3px;
            color: #2c3e50;
            font-family: 'Scheherazade New', 'Amiri', serif;
            font-size: 22px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
            flex: 1; 
            min-width: 32px;
            max-width: 60px;
            height: 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }
        .vk-btn:active, .vk-btn.touched {
            background-color: #bdc3c7;
            border-bottom-width: 1px;
            transform: translateY(2px);
            box-shadow: none;
        }
        .vk-btn.shift-active {
            background-color: #e67e22 !important;
            color: white !important;
            border-color: #d35400 !important;
        }
        .vk-btn.ctrl-active {
            background-color: #2980b9 !important;
            color: white !important;
            border-color: #1f618d !important;
        }
        .latin-char {
            font-family: sans-serif;
            font-size: 9px;
            color: #c0392b;
            position: absolute;
            top: 2px;
            left: 3px;
        }
        
        .btn-wide { flex: 1.5; max-width: 75px; font-size: 12px; font-family: sans-serif; }
        .btn-wider { flex: 1.8; max-width: 85px; font-size: 12px; font-family: sans-serif; }
        .btn-widest { flex: 2.2; max-width: 100px; font-size: 12px; font-family: sans-serif; }
        .btn-space { flex: 6; max-width: 320px; height: 45px; font-family: sans-serif; font-size: 14px; }
        
        .function-row {
            justify-content: space-between;
            margin-bottom: 10px;
            background-color: #2c3e50;
            padding: 4px;
            border-radius: 6px;
        }
        .vk-btn-func {
            background-color: #f1c40f;
            color: #2c3e50;
            height: 40px;
            font-size: 12px;
            font-family: sans-serif;
            flex: 1;
            max-width: none;
            font-weight: bold;
            border-bottom-width: 3px;
            border-color: #d4ac0d;
        }

        @media (max-width: 600px) {
            .vk-btn { font-size: 18px; height: 42px; min-width: 26px; }
            .latin-char { font-size: 8px; }
            .vk-btn-func { font-size: 10px; height: 36px; }
            textarea { height: 90px; font-size: 28px; line-height: 2; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ketik Arab Nonosoft Khot</h2>

    <div class="toolbar">
        <button class="btn-action" onclick="clearText()">Hapus Semua</button>
        <button class="btn-action" style="background-color: #d35400;" onclick="backspace()">&#8592; Hapus 1 Karakter</button>
    </div>

    <textarea id="arabicInput" placeholder="Ketik huruf lalu gunakan F1-F11 (atau Shift/Ctrl + F1-F10)..."></textarea>

    <div class="keyboard-layout">
        
        <!-- Baris F1 - F12 -->
        <div class="keyboard-row function-row">
            <button class="vk-btn vk-btn-func" data-code="f1">F1</button>
            <button class="vk-btn vk-btn-func" data-code="f2">F2</button>
            <button class="vk-btn vk-btn-func" data-code="f3">F3</button>
            <button class="vk-btn vk-btn-func" data-code="f4">F4</button>
            <button class="vk-btn vk-btn-func" data-code="f5">F5</button>
            <button class="vk-btn vk-btn-func" data-code="f6">F6</button>
            <button class="vk-btn vk-btn-func" data-code="f7">F7</button>
            <button class="vk-btn vk-btn-func" data-code="f8">F8</button>
            <button class="vk-btn vk-btn-func" data-code="f9">F9</button>
            <button class="vk-btn vk-btn-func" data-code="f10">F10</button>
            <button class="vk-btn vk-btn-func" data-code="f11">F11</button>
            <button class="vk-btn vk-btn-func" data-code="f12">F12</button>
        </div>

        <!-- Baris Angka & Simbol Atas -->
        <div class="keyboard-row">
            <button class="vk-btn" data-normal="ى" data-shift="~">ى<span class="latin-char">`</span></button>
            <button class="vk-btn" data-normal="١" data-shift="!">١<span class="latin-char">1</span></button>
            <button class="vk-btn" data-normal="٢" data-shift="@">٢<span class="latin-char">2</span></button>
            <button class="vk-btn" data-normal="٣" data-shift="#">٣<span class="latin-char">3</span></button>
            <button class="vk-btn" data-normal="٤" data-shift="$">٤<span class="latin-char">4</span></button>
            <button class="vk-btn" data-normal="٥" data-shift="%">٥<span class="latin-char">5</span></button>
            <button class="vk-btn" data-normal="٦" data-shift="^">٦<span class="latin-char">6</span></button>
            <button class="vk-btn" data-normal="٧" data-shift="&">٧<span class="latin-char">7</span></button>
            <button class="vk-btn" data-normal="٨" data-shift="*">٨<span class="latin-char">8</span></button>
            <button class="vk-btn" data-normal="٩" data-shift="(">٩<span class="latin-char">9</span></button>
            <button class="vk-btn" data-normal="٠" data-shift=")">٠<span class="latin-char">0</span></button>
            <button class="vk-btn" data-normal="-" data-shift="_">-<span class="latin-char">-</span></button>
            <button class="vk-btn" data-normal="=" data-shift="+">=<span class="latin-char">=</span></button>
            <button class="vk-btn btn-wide" onclick="backspace()">Back</button>
        </div>

        <!-- Baris ke-2 -->
        <div class="keyboard-row">
            <button class="vk-btn btn-wide">Tab</button>
            <button class="vk-btn" data-normal="ق" data-shift="Q">ق<span class="latin-char">Q</span></button>
            <button class="vk-btn" data-normal="و" data-shift="W">و<span class="latin-char">W</span></button>
            <button class="vk-btn" data-normal="ع" data-shift="E">ع<span class="latin-char">E</span></button>
            <button class="vk-btn" data-normal="ر" data-shift="R">ر<span class="latin-char">R</span></button>
            <button class="vk-btn" data-normal="ت" data-shift="T">ت<span class="latin-char">T</span></button>
            <button class="vk-btn" data-normal="ي" data-shift="Y">ي<span class="latin-char">Y</span></button>
            <button class="vk-btn" data-normal="ث" data-shift="U">ث<span class="latin-char">U</span></button>
            <button class="vk-btn" data-normal="ء" data-shift="I">ء<span class="latin-char">I</span></button>
            <button class="vk-btn" data-normal="خ" data-shift="O">خ<span class="latin-char">O</span></button>
            <button class="vk-btn" data-normal="ح" data-shift="P">ح<span class="latin-char">P</span></button>
            <button class="vk-btn" data-normal="ض" data-shift="{">ض<span class="latin-char">[</span></button>
            <button class="vk-btn" data-normal="ص" data-shift="}">ص<span class="latin-char">]</span></button>
            <button class="vk-btn btn-wide" data-normal="\" data-shift="|">\</button>
        </div>

        <!-- Baris ke-3 -->
        <div class="keyboard-row">
            <button class="vk-btn btn-wider">Caps</button>
            <button class="vk-btn" data-normal="ا" data-shift="A">ا<span class="latin-char">A</span></button>
            <button class="vk-btn" data-normal="س" data-shift="S">س<span class="latin-char">S</span></button>
            <button class="vk-btn" data-normal="د" data-shift="D">د<span class="latin-char">D</span></button>
            <button class="vk-btn" data-normal="ف" data-shift="F">ف<span class="latin-char">F</span></button>
            <button class="vk-btn" data-normal="غ" data-shift="G">غ<span class="latin-char">G</span></button>
            <button class="vk-btn" data-normal="ه" data-shift="H">ه<span class="latin-char">H</span></button>
            <button class="vk-btn" data-normal="ج" data-shift="J">ج<span class="latin-char">J</span></button>
            <button class="vk-btn" data-normal="ك" data-shift="K">ك<span class="latin-char">K</span></button>
            <button class="vk-btn" data-normal="ل" data-shift="L">ل<span class="latin-char">L</span></button>
            <button class="vk-btn" data-normal="ظ" data-shift=":">ظ<span class="latin-char">;</span></button>
            <button class="vk-btn" data-normal="ط" data-shift='"'>ط<span class="latin-char">'</span></button>
            <button class="vk-btn btn-widest" data-normal="\n">Enter &#8529;</button>
        </div>

        <!-- Baris ke-4 -->
        <div class="keyboard-row">
            <button class="vk-btn btn-widest shift-key">Shift</button>
            <button class="vk-btn" data-normal="ز" data-shift="Z">ز<span class="latin-char">Z</span></button>
            <button class="vk-btn" data-normal="ل" data-shift="X">ل<span class="latin-char">X</span></button>
            <button class="vk-btn" data-normal="ذ" data-shift="C">ذ<span class="latin-char">C</span></button>
            <button class="vk-btn" data-normal="ب" data-shift="V">ب<span class="latin-char">V</span></button>
            <button class="vk-btn" data-normal="ش" data-shift="B">ش<span class="latin-char">B</span></button>
            <button class="vk-btn" data-normal="ن" data-shift="N">ن<span class="latin-char">N</span></button>
            <button class="vk-btn" data-normal="م" data-shift="M">م<span class="latin-char">M</span></button>
            <button class="vk-btn" data-normal="ة" data-shift="<">ة<span class="latin-char">,</span></button>
            <button class="vk-btn" data-normal="ؤ" data-shift=">">ؤ<span class="latin-char">.</span></button>
            <button class="vk-btn" data-normal="ئ" data-shift="?">ئ<span class="latin-char">/</span></button>
            <button class="vk-btn btn-widest shift-key">Shift</button>
        </div>

        <!-- Baris Bawah -->
        <div class="keyboard-row">
            <button class="vk-btn btn-wide ctrl-key">Ctrl</button>
            <button class="vk-btn btn-wide">Win</button>
            <button class="vk-btn btn-wide">Alt</button>
            <button class="vk-btn btn-space" data-normal=" ">Spasi (Space)</button>
            <button class="vk-btn btn-wide">Alt</button>
            <button class="vk-btn btn-wide ctrl-key">Ctrl</button>
        </div>

    </div>
</div>

<script>
    var inputArea = document.getElementById('arabicInput');
    var shiftButtons = document.querySelectorAll('.shift-key');
    var ctrlButtons = document.querySelectorAll('.ctrl-key');
    
    var isShiftActive = false;
    var isCtrlActive = false;

    // Toggle Shift Layar
    shiftButtons.forEach(function(sb) {
        sb.addEventListener('click', function(e) {
            e.preventDefault();
            isShiftActive = !isShiftActive;
            if (isShiftActive) isCtrlActive = false;
            updateModifierStyles();
        });
    });

    // Toggle Ctrl Layar
    ctrlButtons.forEach(function(cb) {
        cb.addEventListener('click', function(e) {
            e.preventDefault();
            isCtrlActive = !isCtrlActive;
            if (isCtrlActive) isShiftActive = false;
            updateModifierStyles();
        });
    });

    function updateModifierStyles() {
        shiftButtons.forEach(function(btn) {
            if (isShiftActive) btn.classList.add('shift-active');
            else btn.classList.remove('shift-active');
        });
        ctrlButtons.forEach(function(btn) {
            if (isCtrlActive) btn.classList.add('ctrl-active');
            else btn.classList.remove('ctrl-active');
        });
    }

    // Pemetaan Unicode Harakat Berdasarkan Spesifikasi Nonosoft Khot
    function getHarakatUnicode(key, isShift, isCtrl) {
        var k = key.toLowerCase();

        // --- KOMBINASI SHIFT + F1 s/d F10 ---
        if (isShift) {
            switch(k) {
                case 'f1':  return '\u0670'; // Fathah Kharijah / Fathah Tegak
                case 'f2':  return '\u0650\u0656'; // Fathah diikuti Kasrah kecil (Tajwid)
                case 'f3':  return '\u0657'; // Dammah Khasiyyah / Dammah Terbalik Panjang
                case 'f4':  return '\u064B'; // Fathatain Variasi Miring Ganda
                case 'f5':  return '\u064D'; // Kasratan Variasi Miring Ganda
                case 'f6':  return '\u064C'; // Dammatan Variasi Al-Qur'an
                case 'f7':  return '\u0670'; // Tanda baca Al-Qur'an (Mad kecil/Fathah pendek)
                case 'f8':  return '\u0656'; // Harakat Berdiri di Bawah Huruf (Kasrah Tegak)
                case 'f9':  return '\u064F\u0654'; // Tanda Hamzah di atas Harakat Dammah
                case 'f10': return '\u0653'; // Maddah / Tanda Mad Panjang
            }
        }
        
        // --- KOMBINASI CTRL + F1 s/d F10 ---
        if (isCtrl) {
            switch(k) {
                case 'f1':  return '\u0651'; // Shaddah / Tasydid
                case 'f2':  return '\u0651\u0650'; // Shaddah + Kasrah
                case 'f3':  return '\u0651\u064F'; // Shaddah + Dammah
                case 'f4':  return '\u0651\u064B'; // Shaddah + Fathatain
                case 'f5':  return '\u0651\u064D'; // Shaddah + Kasratan
                case 'f6':  return '\u0651\u064C'; // Shaddah + Dammatan
                case 'f10': return '\u0651\u064E'; // Shaddah + Fathah
            }
        }

        // --- TOMBOL FUNGSI UTAMA (F1 s/d F11 Biasa) ---
        switch(k) {
            case 'f1':  return '\u064E'; // Fathah
            case 'f2':  return '\u0650'; // Kasrah
            case 'f3':  return '\u064F'; // Dammah
            case 'f4':  return '\u064B'; // Fathatain / Tanwin Fathah
            case 'f5':  return '\u064D'; // Kasratan / Tanwin Kasrah
            case 'f6':  return '\u064C'; // Dammatan / Tanwin Dammah
            case 'f7':  return '\u0652'; // Sukun Koma Atas
            case 'f8':  return '\u0656'; // Kasrah Tegak
            case 'f9':  return '\u0657'; // Dammah Terbalik
            case 'f10': return '\u0652'; // Sukun Biasa / Bulat
            case 'f11': return '\u06E1'; // Sukun Bulat Kecil / Tanda Waqaf
            default:    return null;
        }
    }

    // Klik Tombol Virtual Keyboard
    document.querySelectorAll('.vk-btn').forEach(function(button) {
        button.addEventListener('click', function(e) {
            e.preventDefault();
            if (this.classList.contains('shift-key') || this.classList.contains('ctrl-key')) return;

            var code = this.getAttribute('data-code');
            var normalChar = this.getAttribute('data-normal');
            var shiftChar = this.getAttribute('data-shift');

            if (code) {
                var unicodeChar = getHarakatUnicode(code, isShiftActive, isCtrlActive);
                if (unicodeChar) insertText(unicodeChar);
            } else if (normalChar !== null) {
                var charToInsert = (isShiftActive && shiftChar) ? shiftChar : normalChar;
                insertText(charToInsert);
            }

            // Reset Shift dan Ctrl setelah karakter dimasukkan
            if (isShiftActive || isCtrlActive) {
                isShiftActive = false;
                isCtrlActive = false;
                updateModifierStyles();
            }
        });
    });

    // Mengetik via Keyboard Fisik Komputer
    document.addEventListener('keydown', function(e) {
        var keyLower = e.key.toLowerCase();
        if (keyLower.startsWith('f') && keyLower.length <= 3) {
            var unicodeChar = getHarakatUnicode(keyLower, e.shiftKey, e.ctrlKey);
            if (unicodeChar) {
                e.preventDefault(); // Mencegah pintasan browser bawaan
                insertText(unicodeChar);
            }
        }
    });

    function insertText(text) {
        var start = inputArea.selectionStart;
        var end = inputArea.selectionEnd;
        var val = inputArea.value;

        if (text === '\\n') text = '\n';

        inputArea.value = val.substring(0, start) + text + val.substring(end);
        var newPos = start + text.length;
        inputArea.selectionStart = inputArea.selectionEnd = newPos;
        inputArea.focus();
    }

    function backspace() {
        var start = inputArea.selectionStart;
        var end = inputArea.selectionEnd;
        var val = inputArea.value;

        if (start !== end) {
            inputArea.value = val.substring(0, start) + val.substring(end);
            inputArea.selectionStart = inputArea.selectionEnd = start;
        } else if (start > 0) {
            inputArea.value = val.substring(0, start - 1) + val.substring(end);
            inputArea.selectionStart = inputArea.selectionEnd = start - 1;
        }
        inputArea.focus();
    }

    function clearText() {
        inputArea.value = '';
        inputArea.focus();
    }

    // Registrasi Service Worker PWA Offline
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('./sw.js')
                .then(function() { console.log('PWA Service Worker aktif!'); })
                .catch(function(err) { console.log('Gagal daftar SW:', err); });
        });
    }
</script>

</body>
</html>
