<script>
    // ==========================================
    // KONFIGURASI ADMIN (GOOGLE SHEETS WEB APP)
    // ==========================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby-f_EDZ_cFLoSGX1JIl8LkZ_gL1M9QV1UUibpJcsK3Qc9XgATQP4bae8MgNZgMWJMn7g/exec"; 

    function trackUser(activityName) {
        if (!SCRIPT_URL || SCRIPT_URL.includes("MASUKKAN_URL")) return;
        
        let data = {
            activity: activityName,
            userAgent: navigator.userAgent
        };

        if (navigator.sendBeacon) {
            let blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            navigator.sendBeacon(SCRIPT_URL, blob);
        } else {
            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(data),
                keepalive: true
            }).catch(() => {});
        }
    }

    window.addEventListener("DOMContentLoaded", () => {
        trackUser("Membuka Website Ketik Arab");
    });

    // ------------------------------------------
    // LOGIKA KEYBOARD NONOSOFT KHOT
    // ------------------------------------------
    const inputArea = document.getElementById('arabicInput');
    const buttons = document.querySelectorAll('.vk-btn:not(.shift-key)');
    const shiftButtons = document.querySelectorAll('.shift-key');
    
    let isShiftActive = false;

    // Toggle Tombol Shift
    shiftButtons.forEach(shiftBtn => {
        shiftBtn.addEventListener('click', function(e) {
            e.preventDefault();
            isShiftActive = !isShiftActive;
            shiftButtons.forEach(sb => {
                if (isShiftActive) sb.classList.add('shift-active');
                else sb.classList.remove('shift-active');
            });
        });
    });

    // Pemetaan Karakter Khusus Nonosoft Khot
    function resolveArabicChar(rawChar) {
        switch (rawChar) {
            // --- Normal Long Vowels (Mad) ---
            case 'aa':  return '\u064E\u0627'; // Fathah + Alif
            case 'ii':  return '\u0650\u064A'; // Kasrah + Ya
            case 'uu':  return '\u064F\u0648'; // Dammah + Wau

            // --- Shift + Long Vowels (Tasydid + Mad) ---
            case 'ّaa': return '\u0651\u064E\u0627'; // Tasydid + Fathah + Alif
            case 'ّii': return '\u0651\u0650\u064A'; // Tasydid + Kasrah + Ya
            case 'ّuu': return '\u0651\u064F\u0648'; // Tasydid + Dammah + Wau

            // --- Shift + Harakat Tanwin / Pendek ---
            case 'َّ': return '\u0651\u064E'; // Tasydid + Fathah
            case 'ِّ': return '\u0651\u0650'; // Tasydid + Kasrah
            case 'ُّ': return '\u0651\u064F'; // Tasydid + Dammah
            case 'ًّ': return '\u0651\u064B'; // Tasydid + Fathatan
            case 'ٍّ': return '\u0651\u064D'; // Tasydid + Kasratan
            case 'ٌّ': return '\u0651\u064C'; // Tasydid + Dammatan

            default:    return rawChar;
        }
    }

    buttons.forEach(button => {
        let normalChar = button.getAttribute('data-normal');
        let shiftChar = button.getAttribute('data-shift');

        if (normalChar !== null && normalChar !== '') {
            button.addEventListener('click', function(e) {
                e.preventDefault();
                
                let rawTarget = (isShiftActive && shiftChar !== null && shiftChar !== '') ? shiftChar : normalChar;
                let finalChar = resolveArabicChar(rawTarget);

                insertText(finalChar);
                triggerEffect(button);

                // Reset state Shift setelah 1 kali klik
                if (isShiftActive) {
                    isShiftActive = false;
                    shiftButtons.forEach(sb => sb.classList.remove('shift-active'));
                }
            });
        }
    });

    function triggerEffect(btn) {
        btn.classList.add('touched');
        setTimeout(() => {
            btn.classList.remove('touched');
        }, 150);
    }

    function insertText(text) {
        let start = inputArea.selectionStart;
        let end = inputArea.selectionEnd;
        let val = inputArea.value;

        if (text === '\\n') text = '\n';

        inputArea.value = val.substring(0, start) + text + val.substring(end);
        
        // Atur posisi kursor setelah karakter dimasukkan
        let newPos = start + text.length;
        inputArea.selectionStart = inputArea.selectionEnd = newPos;
        inputArea.focus();
    }

    function backspace() {
        let start = inputArea.selectionStart;
        let end = inputArea.selectionEnd;
        let val = inputArea.value;

        if (start !== end) {
            inputArea.value = val.substring(0, start) + val.substring(end);
            inputArea.selectionStart = inputArea.selectionEnd = start;
        } else if (start > 0) {
            inputArea.value = val.substring(0, start - 1) + val.substring(end);
            inputArea.selectionStart = inputArea.selectionEnd = start - 1;
        }
        inputArea.focus();
    }

    function clearText() {
        inputArea.value = '';
        inputArea.focus();
    }
</script>
