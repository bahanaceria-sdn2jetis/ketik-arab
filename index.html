<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ketik Arab Gaya Nonosoft Khot</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            text-align: center;
            font-size: 20px;
        }
        textarea {
            width: 100%;
            height: 120px;
            font-family: 'Amiri', serif;
            font-size: 26px;
            direction: rtl;
            text-align: right;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
            background-color: #fff;
        }
        textarea:focus {
            border-color: #3498db;
            outline: none;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            align-items: center;
        }
        .btn-action {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .keyboard-section {
            margin-top: 15px;
        }
        .section-title {
            font-size: 13px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 5px;
        }
        .virtual-keyboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
            gap: 5px;
            margin-bottom: 10px;
        }
        .vk-btn {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 10px 0;
            text-align: center;
            font-family: 'Amiri', serif;
            font-size: 20px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: background 0.1s;
        }
        .vk-btn:active {
            background-color: #cbd5e1;
        }
        .harakat-key {
            background-color: #e0f2fe;
            color: #0369a1;
            font-weight: bold;
        }
        .space-key {
            grid-column: span 4;
            background-color: #f1f5f9;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ketik Arab Nonosoft Khot (HP & PC)</h2>

    <textarea id="arabicInput" placeholder="Ketik di sini atau klik tombol di bawah..."></textarea>

    <div class="toolbar">
        <button class="btn-action" onclick="clearText()">Hapus Semua</button>
        <button class="btn-action" style="background-color: #3b82f6;" onclick="insertSpace()">Spasi</button>
    </div>

    <!-- Tombol Harakat Virtual -->
    <div class="keyboard-section">
        <div class="section-title">Harakat & Tanda Baca:</div>
        <div class="virtual-keyboard">
            <button class="vk-btn harakat-key" onclick="insertText('\u064E')">َ (Fathah)</button>
            <button class="vk-btn harakat-key" onclick="insertText('\u0650')">ِ (Kasrah)</button>
            <button class="vk-btn harakat-key" onclick="insertText('\u064F')">ُ (Dammah)</button>
            <button class="vk-btn harakat-key" onclick="insertText('\u064B')">ً (Fathatain)</button>
            <button class="vk-btn harakat-key" onclick="insertText('\u064C')">ٍ (Kasratain)</button>
            <button class="vk-btn harakat-key" onclick="insertText('\u064D')">ٌ (Dammatain)</button>
            <button class="vk-btn harakat-key" onclick="insertText('\u0651')">ّ (Syaddah)</button>
            <button class="vk-btn harakat-key" onclick="insertText('\u0652')">ْ (Sukun)</button>
        </div>
    </div>

    <!-- Tombol Huruf Hijaiyah Virtual -->
    <div class="keyboard-section">
        <div class="section-title">Huruf Hijaiyah:</div>
        <div class="virtual-keyboard" id="hijaiyahKeyboard"></div>
    </div>
</div>

<script>
    // Daftar huruf sesuai urutan tata letak Nonosoft Khot Standar
    const letters = [
        'ا', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز', 
        'س', 'ش', 'ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق', 'ك', 
        'ل', 'م', 'ن', 'ه', 'و', 'ي', 'ة', 'ؤ', 'ء', 'أ', 'إ'
    ];

    const container = document.getElementById('hijaiyahKeyboard');
    const inputArea = document.getElementById('arabicInput');

    // Generate tombol huruf secara otomatis
    letters.forEach(char => {
        let btn = document.createElement('button');
        btn.className = 'vk-btn';
        btn.innerText = char;
        btn.onclick = () => insertText(char);
        container.appendChild(btn);
    });

    function insertText(text) {
        let start = inputArea.selectionStart;
        let end = inputArea.selectionEnd;
        let val = inputArea.value;

        inputArea.value = val.substring(0, start) + text + val.substring(end);
        inputArea.selectionStart = inputArea.selectionEnd = start + text.length;
        inputArea.focus();
    }

    function insertSpace() {
        insertText(' ');
    }

    function clearText() {
        inputArea.value = '';
        inputArea.focus();
    }
</script>

</body>
</html>
