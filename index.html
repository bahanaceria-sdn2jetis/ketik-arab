<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ketik Arab Nonosoft Khot - QWERTY Layout</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2d3436;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ecf0f1;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h2 {
            color: #2c3e50;
            margin: 0 0 15px 0;
            text-align: center;
            font-size: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            font-family: 'Amiri', serif;
            font-size: 28px;
            direction: rtl;
            text-align: right;
            padding: 10px;
            border: 3px solid #7f8c8d;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 10px;
            color: #000;
        }
        /* --- Area Keyboard Virtual --- */
        .keyboard-layout {
            background-color: #95a5a6; 
            padding: 8px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }
        .vk-btn {
            background-color: #ecf0f1;
            border: 1px solid #bdc3c7;
            border-bottom-width: 3px;
            color: #2c3e50;
            font-family: 'Amiri', serif;
            font-size: 22px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
            flex: 1; 
            min-width: 32px;
            max-width: 60px;
            height: 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .vk-btn:active {
            background-color: #bdc3c7;
            border-bottom-width: 1px;
            transform: translateY(2px);
            box-shadow: none;
        }
        /* Huruf Latin kecil penanda di pojok tombol */
        .latin-char {
            font-family: sans-serif;
            font-size: 9px;
            color: #c0392b;
            position: absolute;
            top: 2px;
            left: 3px;
        }
        
        /* Tombol khusus dengan ukuran berbeda */
        .btn-wide { flex: 1.5; max-width: 75px; font-size: 13px; font-family: sans-serif; }
        .btn-wider { flex: 1.8; max-width: 85px; font-size: 13px; font-family: sans-serif; }
        .btn-widest { flex: 2.2; max-width: 100px; font-size: 13px; font-family: sans-serif; }
        .btn-space { flex: 6; max-width: 320px; height: 45px; font-family: sans-serif; font-size: 14px; }
        
        /* Baris Tombol Fungsi F1-F12 */
        .function-row {
            justify-content: space-between;
            margin-bottom: 10px;
            background-color: #2c3e50;
            padding: 4px;
            border-radius: 6px;
        }
        .vk-btn-func {
            background-color: #bdc3c7;
            color: #111;
            height: 32px;
            font-size: 11px;
            font-family: sans-serif;
            flex: 1;
            max-width: none;
            font-weight: bold;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .btn-action {
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-action:hover { background-color: #922b21; }

        @media (max-width: 600px) {
            .vk-btn { font-size: 18px; height: 42px; min-width: 26px; }
            .latin-char { font-size: 8px; }
            .vk-btn-func { font-size: 9px; height: 28px; }
            textarea { height: 80px; font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ketik Arab Nonosoft Khot (QWERTY Layout)</h2>

    <div class="toolbar">
        <button class="btn-action" onclick="clearText()">Hapus Semua</button>
        <button class="btn-action" style="background-color: #d35400;" onclick="backspace()">← Hapus 1 Karakter</button>
    </div>

    <textarea id="arabicInput" placeholder="Ketuk tombol di bawah untuk mengetik..."></textarea>

    <!-- Area Keyboard Virtual Berdasarkan Layout Gambar Nonosoft QWERTY -->
    <div class="keyboard-layout">
        
        <!-- Baris F1 - F12 (Harakat & Lainnya) -->
        <div class="keyboard-row function-row">
            <button class="vk-btn vk-btn-func" onclick="insertText('\u064E')">F1<br>َ Fathah</button>
            <button class="vk-btn vk-btn-func" onclick="insertText('\u0650')">F2<br>ِ Kasrah</button>
            <button class="vk-btn vk-btn-func" onclick="insertText('\u064F')">F3<br>ُ Dammah</button>
            <button class="vk-btn vk-btn-func" onclick="insertText('\u064B')">F4<br>ً Fathatain</button>
            <button class="vk-btn vk-btn-func" onclick="insertText('\u064C')">F5<br>ٍ Kasratain</button>
            <button class="vk-btn vk-btn-func" onclick="insertText('\u064D')">F6<br>ٌ Dammatain</button>
            <button class="vk-btn vk-btn-func" onclick="insertText('\u0651')">F7<br>ّ Syaddah</button>
            <button class="vk-btn vk-btn-func" onclick="insertText('')">F8</button>
            <button class="vk-btn vk-btn-func" onclick="insertText('')">F9</button>
            <button class="vk-btn vk-btn-func" onclick="insertText('')">F10</button>
            <button class="vk-btn vk-btn-func" onclick="insertText('\u0652')">F11<br>ْ Sukun</button>
            <button class="vk-btn vk-btn-func" onclick="insertText('')">F12</button>
        </div>

        <!-- Baris Angka & Simbol Atas -->
        <div class="keyboard-row">
            <button class="vk-btn" onclick="insertText('ى')">ى<span class="latin-char">`</span></button>
            <button class="vk-btn" onclick="insertText('١')">١<span class="latin-char">1</span></button>
            <button class="vk-btn" onclick="insertText('٢')">٢<span class="latin-char">2</span></button>
            <button class="vk-btn" onclick="insertText('٣')">٣<span class="latin-char">3</span></button>
            <button class="vk-btn" onclick="insertText('٤')">٤<span class="latin-char">4</span></button>
            <button class="vk-btn" onclick="insertText('٥')">٥<span class="latin-char">5</span></button>
            <button class="vk-btn" onclick="insertText('٦')">٦<span class="latin-char">6</span></button>
            <button class="vk-btn" onclick="insertText('٧')">٧<span class="latin-char">7</span></button>
            <button class="vk-btn" onclick="insertText('٨')">٨<span class="latin-char">8</span></button>
            <button class="vk-btn" onclick="insertText('٩')">٩<span class="latin-char">9</span></button>
            <button class="vk-btn" onclick="insertText('٠')">٠<span class="latin-char">0</span></button>
            <button class="vk-btn" onclick="insertText('-')">-<span class="latin-char">-</span></button>
            <button class="vk-btn" onclick="insertText('=')">=<span class="latin-char">=</span></button>
            <button class="vk-btn btn-wide" onclick="backspace()">Backspace</button>
        </div>

        <!-- Baris QWERTY (Q W E R T Y U I O P [ ]) -->
        <div class="keyboard-row">
            <button class="vk-btn btn-wide" onclick="insertText('\t')">Tab</button>
            <button class="vk-btn" onclick="insertText('ق')">ق<span class="latin-char">Q</span></button>
            <button class="vk-btn" onclick="insertText('و')">و<span class="latin-char">W</span></button>
            <button class="vk-btn" onclick="insertText('ع')">ع<span class="latin-char">E</span></button>
            <button class="vk-btn" onclick="insertText('ر')">ر<span class="latin-char">R</span></button>
            <button class="vk-btn" onclick="insertText('ت')">ت<span class="latin-char">T</span></button>
            <button class="vk-btn" onclick="insertText('ي')">ي<span class="latin-char">Y</span></button>
            <button class="vk-btn" onclick="insertText('ث')">ث<span class="latin-char">U</span></button>
            <button class="vk-btn" onclick="insertText('ء')">ء<span class="latin-char">I</span></button>
            <button class="vk-btn" onclick="insertText('خ')">خ<span class="latin-char">O</span></button>
            <button class="vk-btn" onclick="insertText('ح')">ح<span class="latin-char">P</span></button>
            <button class="vk-btn" onclick="insertText('ج')">ج<span class="latin-char">[</span></button>
            <button class="vk-btn" onclick="insertText('د')">د<span class="latin-char">]</span></button>
            <button class="vk-btn btn-wide" onclick="insertText('\\')">\</button>
        </div>

        <!-- Baris ASDFGH (A S D F G H J K L ; ') -->
        <div class="keyboard-row">
            <button class="vk-btn btn-wider" onclick="insertText('')">Caps</button>
            <button class="vk-btn" onclick="insertText('ش')">ش<span class="latin-char">A</span></button>
            <button class="vk-btn" onclick="insertText('س')">س<span class="latin-char">S</span></button>
            <button class="vk-btn" onclick="insertText('ي')">ي<span class="latin-char">D</span></button>
            <button class="vk-btn" onclick="insertText('ب')">ب<span class="latin-char">F</span></button>
            <button class="vk-btn" onclick="insertText('ل')">ل<span class="latin-char">G</span></button>
            <button class="vk-btn" onclick="insertText('ا')">ا<span class="latin-char">H</span></button>
            <button class="vk-btn" onclick="insertText('ت')">ت<span class="latin-char">J</span></button>
            <button class="vk-btn" onclick="insertText('ن')">ن<span class="latin-char">K</span></button>
            <button class="vk-btn" onclick="insertText('م')">م<span class="latin-char">L</span></button>
            <button class="vk-btn" onclick="insertText('ك')">ك<span class="latin-char">;</span></button>
            <button class="vk-btn" onclick="insertText('ة')">ة<span class="latin-char">'</span></button>
            <button class="vk-btn btn-widest" onclick="insertText('\n')">Enter ↵</button>
        </div>

        <!-- Baris ZXCVBN (Z X C V B N M , . /) -->
        <div class="keyboard-row">
            <button class="vk-btn btn-widest" onclick="insertText('')">Shift</button>
            <button class="vk-btn" onclick="insertText('ظ')">ظ<span class="latin-char">Z</span></button>
            <button class="vk-btn" onclick="insertText('ط')">ط<span class="latin-char">X</span></button>
            <button class="vk-btn" onclick="insertText('ذ')">ذ<span class="latin-char">C</span></button>
            <button class="vk-btn" onclick="insertText('ء')">ء<span class="latin-char">V</span></button>
            <button class="vk-btn" onclick="insertText('ؤ')">ؤ<span class="latin-char">B</span></button>
            <button class="vk-btn" onclick="insertText('إ')">إ<span class="latin-char">N</span></button>
            <button class="vk-btn" onclick="insertText('أ')">أ<span class="latin-char">M</span></button>
            <button class="vk-btn" onclick="insertText('ئ')">ئ<span class="latin-char">,</span></button>
            <button class="vk-btn" onclick="insertText('ء')">ء<span class="latin-char">.</span></button>
            <button class="vk-btn" onclick="insertText('ء')">ء<span class="latin-char">/</span></button>
            <button class="vk-btn btn-widest" onclick="insertText('')">Shift</button>
        </div>

        <!-- Baris Bawah (Spasi, dll) -->
        <div class="keyboard-row">
            <button class="vk-btn btn-wide" onclick="insertText('')">Ctrl</button>
            <button class="vk-btn btn-wide" onclick="insertText('')">Win</button>
            <button class="vk-btn btn-wide" onclick="insertText('')">Alt</button>
            <button class="vk-btn btn-space" onclick="insertText(' ')">Spasi (Space)</button>
            <button class="vk-btn btn-wide" onclick="insertText('')">Alt</button>
            <button class="vk-btn btn-wide" onclick="insertText('')">Ctrl</button>
        </div>

    </div>
</div>

<script>
    const inputArea = document.getElementById('arabicInput');

    // Fungsi memasukkan huruf/harakat persis di posisi kursor aktif
    function insertText(text) {
        let start = inputArea.selectionStart;
        let end = inputArea.selectionEnd;
        let val = inputArea.value;

        inputArea.value = val.substring(0, start) + text + val.substring(end);
        inputArea.selectionStart = inputArea.selectionEnd = start + text.length;
        inputArea.focus();
    }

    // Fungsi tombol Backspace virtual
    function backspace() {
        let start = inputArea.selectionStart;
        let end = inputArea.selectionEnd;
        let val = inputArea.value;

        if (start !== end) {
            // Jika ada teks yang diseleksi, hapus bagian itu
            inputArea.value = val.substring(0, start) + val.substring(end);
            inputArea.selectionStart = inputArea.selectionEnd = start;
        } else if (start > 0) {
            // Jika tidak ada seleksi, hapus 1 karakter sebelum kursor
            inputArea.value = val.substring(0, start - 1) + val.substring(end);
            inputArea.selectionStart = inputArea.selectionEnd = start - 1;
        }
        inputArea.focus();
    }

    // Fungsi hapus semua isi teks
    function clearText() {
        inputArea.value = '';
        inputArea.focus();
    }
</script>

</body>
</html>
