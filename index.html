<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ketik Arab Nonosoft Khot - Sesuai Gambar</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2d3436;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ecf0f1;
            touch-action: manipulation;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h2 {
            color: #2c3e50;
            margin: 0 0 15px 0;
            text-align: center;
            font-size: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            font-family: 'Amiri', serif;
            font-size: 28px;
            direction: rtl;
            text-align: right;
            padding: 10px;
            border: 3px solid #7f8c8d;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 10px;
            color: #000;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .btn-action {
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-action:active { background-color: #922b21; }

        /* --- Area Keyboard Virtual --- */
        .keyboard-layout {
            background-color: #95a5a6; 
            padding: 8px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }
        .vk-btn {
            background-color: #ecf0f1;
            border: 1px solid #bdc3c7;
            border-bottom-width: 3px;
            color: #2c3e50;
            font-family: 'Amiri', serif;
            font-size: 22px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
            flex: 1; 
            min-width: 32px;
            max-width: 60px;
            height: 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .vk-btn:active, .vk-btn.touched {
            background-color: #bdc3c7;
            border-bottom-width: 1px;
            transform: translateY(2px);
            box-shadow: none;
        }
        .latin-char {
            font-family: sans-serif;
            font-size: 9px;
            color: #c0392b;
            position: absolute;
            top: 2px;
            left: 3px;
        }
        
        /* Ukuran tombol khusus */
        .btn-wide { flex: 1.5; max-width: 75px; font-size: 12px; font-family: sans-serif; }
        .btn-wider { flex: 1.8; max-width: 85px; font-size: 12px; font-family: sans-serif; }
        .btn-widest { flex: 2.2; max-width: 100px; font-size: 12px; font-family: sans-serif; }
        .btn-space { flex: 6; max-width: 320px; height: 45px; font-family: sans-serif; font-size: 14px; }
        
        /* Baris Tombol Fungsi F1-F12 */
        .function-row {
            justify-content: space-between;
            margin-bottom: 10px;
            background-color: #2c3e50;
            padding: 4px;
            border-radius: 6px;
        }
        .vk-btn-func {
            background-color: #f1c40f;
            color: #2c3e50;
            height: 36px;
            font-size: 10px;
            font-family: sans-serif;
            flex: 1;
            max-width: none;
            font-weight: bold;
            border-bottom-width: 3px;
            border-color: #d4ac0d;
        }

        @media (max-width: 600px) {
            .vk-btn { font-size: 18px; height: 42px; min-width: 26px; }
            .latin-char { font-size: 8px; }
            .vk-btn-func { font-size: 9px; height: 32px; }
            textarea { height: 80px; font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ketik Arab Nonosoft Khot (Sesuai Gambar)</h2>

    <div class="toolbar">
        <button class="btn-action" onclick="clearText()">Hapus Semua</button>
        <button class="btn-action" style="background-color: #d35400;" onclick="backspace()">← Hapus 1 Karakter</button>
    </div>

    <textarea id="arabicInput" placeholder="Sentuh tombol di bawah untuk mengetik..."></textarea>

    <div class="keyboard-layout">
        
        <!-- Baris F1 - F12 (Harakat Nonosoft Khot) -->
        <div class="keyboard-row function-row">
            <button class="vk-btn vk-btn-func" data-char="\u064E">F1<br>َ Fathah</button>
            <button class="vk-btn vk-btn-func" data-char="\u0650">F2<br>ِ Kasrah</button>
            <button class="vk-btn vk-btn-func" data-char="\u064F">F3<br>ُ Dammah</button>
            <button class="vk-btn vk-btn-func" data-char="\u064B">F4<br>ً Fathatain</button>
            <button class="vk-btn vk-btn-func" data-char="\u064C">F5<br>ٍ Kasratain</button>
            <button class="vk-btn vk-btn-func" data-char="\u064D">F6<br>ٌ Dammatain</button>
            <button class="vk-btn vk-btn-func" data-char="\u0651">F7<br>ّ Syaddah</button>
            <button class="vk-btn vk-btn-func" data-char="">F8</button>
            <button class="vk-btn vk-btn-func" data-char="">F9</button>
            <button class="vk-btn vk-btn-func" data-char="">F10</button>
            <button class="vk-btn vk-btn-func" data-char="\u0652">F11<br>ْ Sukun</button>
            <button class="vk-btn vk-btn-func" data-char="">F12</button>
        </div>

        <!-- Baris Angka & Simbol Atas -->
        <div class="keyboard-row">
            <button class="vk-btn" data-char="ى">ى<span class="latin-char">`</span></button>
            <button class="vk-btn" data-char="١">١<span class="latin-char">1</span></button>
            <button class="vk-btn" data-char="٢">٢<span class="latin-char">2</span></button>
            <button class="vk-btn" data-char="٣">٣<span class="latin-char">3</span></button>
            <button class="vk-btn" data-char="٤">٤<span class="latin-char">4</span></button>
            <button class="vk-btn" data-char="٥">٥<span class="latin-char">5</span></button>
            <button class="vk-btn" data-char="٦">٦<span class="latin-char">6</span></button>
            <button class="vk-btn" data-char="٧">٧<span class="latin-char">7</span></button>
            <button class="vk-btn" data-char="٨">٨<span class="latin-char">8</span></button>
            <button class="vk-btn" data-char="٩">٩<span class="latin-char">9</span></button>
            <button class="vk-btn" data-char="٠">٠<span class="latin-char">0</span></button>
            <button class="vk-btn" data-char="-">-<span class="latin-char">-</span></button>
            <button class="vk-btn" data-char="=">=<span class="latin-char">=</span></button>
            <button class="vk-btn btn-wide" onclick="backspace()">Back</button>
        </div>

        <!-- Baris ke-2: Q W E R T Y U I O P [ ] \ -->
        <div class="keyboard-row">
            <button class="vk-btn btn-wide" data-char="">Tab</button>
            <button class="vk-btn" data-char="ق">ق<span class="latin-char">Q</span></button>
            <button class="vk-btn" data-char="و">و<span class="latin-char">W</span></button>
            <button class="vk-btn" data-char="ع">ع<span class="latin-char">E</span></button>
            <button class="vk-btn" data-char="ر">ر<span class="latin-char">R</span></button>
            <button class="vk-btn" data-char="ت">ت<span class="latin-char">T</span></button>
            <button class="vk-btn" data-char="ي">ي<span class="latin-char">Y</span></button>
            <button class="vk-btn" data-char="ث">ث<span class="latin-char">U</span></button>
            <button class="vk-btn" data-char="ء">ء<span class="latin-char">I</span></button>
            <button class="vk-btn" data-char="خ">خ<span class="latin-char">O</span></button>
            <button class="vk-btn" data-char="ح">ح<span class="latin-char">P</span></button>
            <button class="vk-btn" data-char="ض">ض<span class="latin-char">[</span></button>
            <button class="vk-btn" data-char="ص">ص<span class="latin-char">]</span></button>
            <button class="vk-btn btn-wide" data-char="\">\</button>
        </div>

        <!-- Baris ke-3: A S D F G H J K L ; ' Enter -->
        <div class="keyboard-row">
            <button class="vk-btn btn-wider" data-char="">Caps</button>
            <button class="vk-btn" data-char="ا">ا<span class="latin-char">A</span></button>
            <button class="vk-btn" data-char="س">س<span class="latin-char">S</span></button>
            <button class="vk-btn" data-char="د">د<span class="latin-char">D</span></button>
            <button class="vk-btn" data-char="ف">ف<span class="latin-char">F</span></button>
            <button class="vk-btn" data-char="غ">غ<span class="latin-char">G</span></button>
            <button class="vk-btn" data-char="ه">ه<span class="latin-char">H</span></button>
            <button class="vk-btn" data-char="ج">ج<span class="latin-char">J</span></button>
            <button class="vk-btn" data-char="ك">ك<span class="latin-char">K</span></button>
            <button class="vk-btn" data-char="ل">ل<span class="latin-char">L</span></button>
            <button class="vk-btn" data-char="ظ">ظ<span class="latin-char">;</span></button>
            <button class="vk-btn" data-char="ط">ط<span class="latin-char">'</span></button>
            <button class="vk-btn btn-widest" data-char="\n">Enter ↵</button>
        </div>

        <!-- Baris ke-4: Shift Z X C V B N M , . / Shift -->
        <div class="keyboard-row">
            <button class="vk-btn btn-widest" data-char="">Shift</button>
            <button class="vk-btn" data-char="ز">ز<span class="latin-char">Z</span></button>
            <button class="vk-btn" data-char="ل">ل<span class="latin-char">X</span></button>
            <button class="vk-btn" data-char="ذ">ذ<span class="latin-char">C</span></button>
            <button class="vk-btn" data-char="ب">ب<span class="latin-char">V</span></button>
            <button class="vk-btn" data-char="ش">ش<span class="latin-char">B</span></button>
            <button class="vk-btn" data-char="ن">ن<span class="latin-char">N</span></button>
            <button class="vk-btn" data-char="م">م<span class="latin-char">M</span></button>
            <button class="vk-btn" data-char="ة">ة<span class="latin-char">,</span></button>
            <button class="vk-btn" data-char="ؤ">ؤ<span class="latin-char">.</span></button>
            <button class="vk-btn" data-char="ؤ">ؤ<span class="latin-char">/</span></button>
            <button class="vk-btn btn-widest" data-char="">Shift</button>
        </div>

        <!-- Baris Bawah (Spasi, dll) -->
        <div class="keyboard-row">
            <button class="vk-btn btn-wide" data-char="">Ctrl</button>
            <button class="vk-btn btn-wide" data-char="">Win</button>
            <button class="vk-btn btn-wide" data-char="">Alt</button>
            <button class="vk-btn btn-space" data-char=" ">Spasi (Space)</button>
            <button class="vk-btn btn-wide" data-char="">Alt</button>
            <button class="vk-btn btn-wide" data-char="">Ctrl</button>
        </div>

    </div>
</div>

<script>
    const inputArea = document.getElementById('arabicInput');
    const buttons = document.querySelectorAll('.vk-btn');
    
    buttons.forEach(button => {
        let charToInsert = button.getAttribute('data-char');
        if (charToInsert !== null && charToInsert !== '') {
            // Menggunakan fungsi mousedown & touchstart agar langsung merespons di HP maupun PC
            const handlePress = (e) => {
                e.preventDefault();
                insertText(charToInsert);
                triggerEffect(button);
            };

            button.addEventListener('touchstart', handlePress, {passive: false});
            button.addEventListener('mousedown', handlePress);
        }
    });

    function triggerEffect(btn) {
        btn.classList.add('touched');
        setTimeout(() => {
            btn.classList.remove('touched');
        }, 150);
    }

    function insertText(text) {
        let start = inputArea.selectionStart;
        let end = inputArea.selectionEnd;
        let val = inputArea.value;

        inputArea.value = val.substring(0, start) + text + val.substring(end);
        inputArea.selectionStart = inputArea.selectionEnd = start + text.length;
        inputArea.focus();
    }

    function backspace() {
        let start = inputArea.selectionStart;
        let end = inputArea.selectionEnd;
        let val = inputArea.value;

        if (start !== end) {
            inputArea.value = val.substring(0, start) + val.substring(end);
            inputArea.selectionStart = inputArea.selectionEnd = start;
        } else if (start > 0) {
            inputArea.value = val.substring(0, start - 1) + val.substring(end);
            inputArea.selectionStart = inputArea.selectionEnd = start - 1;
        }
        inputArea.focus();
    }

    function clearText() {
        inputArea.value = '';
        inputArea.focus();
    }
</script>

</body>
</html>
